name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate that fails fast on a syntax error in any shipped JS file
  # (server, rules engine, bot, client, tests) before the heavier suite runs.
  syntax:
    name: syntax check (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check every JS file
        run: |
          for f in server.js lib/*.js public/*.js test/*.js; do
            node --check "$f"
          done

  # The full node:test suite (engine, bot, cards, http, turn, cap, and the
  # socket.io end-to-end flows). Node 22 matches the Docker image; 20 and 24
  # cover the surrounding LTS lines. (Node 18 is past EOL and predates the
  # --test-force-exit flag the test script relies on.)
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
