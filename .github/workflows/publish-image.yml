name: publish-image

# Publishes the multi-arch image (linux/amd64 + linux/arm64) to GHCR.
#   - On every push/merge to main: tags `latest` + short SHA (continuous builds).
#   - On a version tag (v*):        tags the version + `latest` and creates a
#     GitHub Release (e.g. v1.0.0 -> ghcr.io/ufz0/uno-game:v1.0.0).
# Auth: image push via the GHCR_TOKEN repo secret ("packages: write");
# release creation via GITHUB_TOKEN ("contents: write").
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tags
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ver="${GITHUB_REF#refs/tags/}"
            echo "tags=${ver},latest" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=latest,${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + push (linux/amd64 + linux/arm64)
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: bash scripts/push-image.sh

      - name: Create GitHub Release
        if: steps.meta.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
